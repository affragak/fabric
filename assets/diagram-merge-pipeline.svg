<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 1000" width="760" height="1000" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">The merge pipeline</title>
<desc id="d">After a merge the changed files decide whether nothing, the tenants or everything deploys. The change gate requires an approved ticket, approved after the dry run. Then a snapshot and a checkpoint, the ticket moves to implementing, the deploy runs in canary batches with a test after each, and the full tests run. On a pass the configuration is saved and the records are updated; on a failure the switches roll back to the checkpoint.</desc>
<defs><marker id="a-red" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M1,1.2 L8.8,5 L1,8.8 Z" fill="#ea6962"/></marker><linearGradient id="g-red" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ea6962" stop-opacity="0.24"/><stop offset="1" stop-color="#ea6962" stop-opacity="0.05"/></linearGradient><marker id="a-orange" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M1,1.2 L8.8,5 L1,8.8 Z" fill="#e78a4e"/></marker><linearGradient id="g-orange" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e78a4e" stop-opacity="0.24"/><stop offset="1" stop-color="#e78a4e" stop-opacity="0.05"/></linearGradient><marker id="a-yellow" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M1,1.2 L8.8,5 L1,8.8 Z" fill="#d8a657"/></marker><linearGradient id="g-yellow" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d8a657" stop-opacity="0.24"/><stop offset="1" stop-color="#d8a657" stop-opacity="0.05"/></linearGradient><marker id="a-green" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M1,1.2 L8.8,5 L1,8.8 Z" fill="#a9b665"/></marker><linearGradient id="g-green" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a9b665" stop-opacity="0.24"/><stop offset="1" stop-color="#a9b665" stop-opacity="0.05"/></linearGradient><marker id="a-aqua" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M1,1.2 L8.8,5 L1,8.8 Z" fill="#89b482"/></marker><linearGradient id="g-aqua" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#89b482" stop-opacity="0.24"/><stop offset="1" stop-color="#89b482" stop-opacity="0.05"/></linearGradient><marker id="a-blue" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M1,1.2 L8.8,5 L1,8.8 Z" fill="#7daea3"/></marker><linearGradient id="g-blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7daea3" stop-opacity="0.24"/><stop offset="1" stop-color="#7daea3" stop-opacity="0.05"/></linearGradient><marker id="a-purple" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M1,1.2 L8.8,5 L1,8.8 Z" fill="#d3869b"/></marker><linearGradient id="g-purple" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d3869b" stop-opacity="0.24"/><stop offset="1" stop-color="#d3869b" stop-opacity="0.05"/></linearGradient><marker id="a-fg" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M1,1.2 L8.8,5 L1,8.8 Z" fill="#ddc7a1"/></marker><linearGradient id="g-fg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ddc7a1" stop-opacity="0.24"/><stop offset="1" stop-color="#ddc7a1" stop-opacity="0.05"/></linearGradient><filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="soft" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><radialGradient id="bg" cx="50%" cy="0%" r="90%"><stop offset="0" stop-color="#282828"/><stop offset="0.55" stop-color="#1d2021"/><stop offset="1" stop-color="#141617"/></radialGradient><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#5a524c" fill-opacity="0.35"/></pattern><linearGradient id="fade" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#000"/><stop offset="0.5" stop-color="#000"/><stop offset="1" stop-color="#fff"/></linearGradient><mask id="right"><rect width="760" height="1000" fill="url(#fade)"/></mask></defs>
