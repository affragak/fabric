l="#282828"/><rect x="260.0" y="238.0" width="240" height="76" rx="12" fill="url(#g-purple)"/><rect x="260.0" y="238.0" width="240" height="76" rx="12" fill="none" stroke="#d3869b" stroke-width="1.6" filter="url(#glow)"/><text x="380" y="270.5" font-size="15" font-weight="700" fill="#ddc7a1" text-anchor="middle">Change gate</text><text x="380" y="289.5" font-size="12.5" fill="#d4be98" fill-opacity="0.88" text-anchor="middle">approved, after the dry run</text><g transform="translate(494.0,244.0)"><circle r="17" fill="#1d2021" stroke="#d3869b" stroke-width="1.4"/><g fill="none" stroke="#d3869b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M0,-8 L7,-5 V1 C7,5 3,8 0,9 C-3,8 -7,5 -7,1 V-5 Z"/><path d="M-3,0 L-1,3 L4,-3"/></g></g><rect x="554.0" y="242.0" width="176" height="68" rx="12" fill="#282828"/><rect x="554.0" y="242.0" width="176" height="68" rx="12" fill="url(#g-red)"/><rect x="554.0" y="242.0" width="176" height="68" rx="12" fill="none" stroke="#ea6962" stroke-width="1.6" filter="url(#glow)"/><text x="642" y="270.5" font-size="14" font-weight="700" fill="#ddc7a1" text-anchor="middle">Refused</text><text x="642" y="289.5" font-size="12.5" fill="#d4be98" fill-opacity="0.88" text-anchor="middle">nothing was touched</text><g transform="translate(724.0,248.0)"><circle r="17" fill="#1d2021" stroke="#ea6962" stroke-width="1.4"/><g fill="none" stroke="#ea6962" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M-5,-5 L5,5 M5,-5 L-5,5"/></g></g><rect x="260.0" y="352.0" width="240" height="76" rx="12" fill="#282828"/><rect x="260.0" y="352.0" width="240" height="76" rx="12" fill="url(#g-aqua)"/><rect x="260.0" y="352.0" width="240" height="76" rx="12" fill="none" stroke="#89b482" stroke-width="1.6" filter="url(#glow)"/><text x="380" y="384.5" font-size="14.5" font-weight="700" fill="#ddc7a1" text-anchor="middle">Snapshot and checkpoint</text><text x="380" y="403.5" font-size="12.5" fill="#d4be98" fill-opacity="0.88" 