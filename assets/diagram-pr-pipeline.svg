<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 730" width="760" height="730" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">The pull-request pipeline</title>
<desc id="d">A pull request is validated without access to the fabric. A fork's run waits until the owner releases it. Then the dry run in check mode against the live fabric, Batfish on the candidate configuration, and the result on the pull request and on the change ticket.</desc>
<defs><marker id="a-red" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M1,1.2 L8.8,5 L1,8.8 Z" fill="#ea6962"/></marker><linearGradient id="g-red" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ea6962" stop-opacity="0.24"/><stop offset="1" stop-color="#ea6962" stop-opacity="0.05"/></linearGradient><marker id="a-orange" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M1,1.2 L8.8,5 L1,8.8 Z" fill="#e78a4e"/></marker><linearGradient id="g-orange" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e78a4e" stop-opacity="0.24"/><stop offset="1" stop-color="#e78a4e" stop-opacity="0.05"/></linearGradient><marker id="a-yellow" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M1,1.2 L8.8,5 L1,8.8 Z" fill="#d8a657"/></marker><linearGradient id="g-yellow" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d8a657" stop-opacity="0.24"/><stop offset="1" stop-color="#d8a657" stop-opacity="0.05"/></linearGradient><marker id="a-green" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M1,1.2 L8.8,5 L1,8.8 Z" fill="#a9b665"/></marker><linearGradient id="g-green" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a9b665" stop-opacity="0.24"/><stop offset="1" stop-color="#a9b665" stop-opacity="0.05"/></linearGradient><marker id="a-aqua" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M1,1.2 L8.8,5 L1,8.8 Z" fill="#89b482"/></marker><linearGradient id="g-aqua" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#89b482" stop-opacity="0.24"/><stop offset="1" stop-color="#89b482" stop-opacity="0.05"/></linearGradient><marker id="a-blue" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M1,1.2 L8.8,5 L1,8.8 Z" fill="#7daea3"/></marker><linearGradient id="g-blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7daea3" stop-opacity="0.24"/><stop offset="1" stop-color="#7daea3" stop-opacity="0.05"/></linearGradient><marker id="a-purple" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M1,1.2 L8.8,5 L1,8.8 Z" fill="#d3869b"/></marker><linearGradient id="g-purple" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d3869b" stop-opacity="0.24"/><stop offset="1" stop-color="#d3869b" stop-opacity="0.05"/></linearGradient><marker id="a-fg" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M1,1.2 L8.8,5 L1,8.8 Z" fill="#ddc7a1"/></marker><linearGradient id="g-fg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ddc7a1" stop-opacity="0.24"/><stop offset="1" stop-color="#ddc7a1" stop-opacity="0.05"/></linearGradient><filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="soft" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><radialGradient id="bg" cx="50%" cy="0%" r="90%"><stop offset="0" stop-color="#282828"/><stop offset="0.55" stop-color="#1d2021"/><stop offset="1" stop-color="#141617"/></radialGradient><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#5a524c" fill-opacity="0.35"/></pattern><linearGradient id="fade" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#000"/><stop offset="0.5" stop-color="#000"/><stop offset="1" stop-color="#fff"/></linearGradient><mask id="right"><rect width="760" height="730" fill="url(#fade)"/></mask></defs>
<rect width="760" height="730" rx="18" fill="url(#bg)"/>
<rect width="760" height="730" rx="18" fill="url(#dots)" mask="url(#right)"/>
<g filter="url(#soft)"><path d="M300,84 L300,122" fill="none" stroke="#ddc7a1" stroke-width="2" stroke-linecap="round" marker-end="url(#a-fg)"/><path d="M300,208 L300,254" fill="none" stroke="#7daea3" stroke-width="2" stroke-linecap="round" marker-end="url(#a-blue)"/><path d="M420,284 L488,284" fill="none" stroke="#d8a657" stroke-width="2" stroke-linecap="round" marker-end="url(#a-yellow)"/><path d="M300,312 L300,370" fill="none" stroke="#d8a657" stroke-width="2" stroke-linecap="round" marker-end="url(#a-yellow)"/><path d="M600,322 L600,400 Q600,414 586,414 L422,414" fill="none" stroke="#d3869b" stroke-width="2" stroke-linecap="round" marker-end="url(#a-purple)"/><path d="M300,456 L300,498" fill="none" stroke="#a9b665" stroke-width="2" stroke-linecap="round" marker-end="url(#a-green)"/><path d="M300,576 L300,612" fill="none" stroke="#89b482" stroke-width="2" stroke-linecap="round" marker-end="url(#a-aqua)"/></g>
<rect x="180.0" y="28.0" width="240" height="56" rx="12" fill="#282828"/><rect x="180.0" y="28.0" width="240" height="56" rx="12" fill="url(#g-fg)"/><rect x="180.0" y="28.0" width="240" height="56" rx="12" fill="none" stroke="#ddc7a1" stroke-width="1.6" filter="url(#glow)"/><text x="300" y="61.0" font-size="15" font-weight="700" fill="#ddc7a1" text-anchor="middle">Pull request</text><g transform="translate(414.0,34.0)"><circle r="17" fill="#1d2021" stroke="#ddc7a1" stroke-width="1.4"/><g fill="none" stroke="#ddc7a1" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="-5" cy="-6" r="2.2"/><circle cx="-5" cy="6" r="2.2"/><circle cx="6" cy="6" r="2.2"/><path d="M-5,-3.8 V3.8 M6,3.8 V-1 C6,-4 4,-6 1,-6 H-1"/></g></g><rect x="180.0" y="124.0" width="240" height="84" rx="12" fill="#282828"/><rect x="180.0" y="124.0" width="240" height="84" rx="12" fill="url(#g-blue)"/><rect x="180.0" y="124.0" width="240" height="84" rx="12" fill="none" stroke="#7daea3" stroke-width="1.6" filter="url(#glow)"/><text x="300" y="152.0" font-size="15" font-weight="700" fill="#ddc7a1" text-anchor="middle">validate</text><text x="300" y="171.0" font-size="12.5" fill="#d4be98" fill-opacity="0.88" text-anchor="middle">lint · schema · security</text><text x="300" y="188.0" font-size="12.5" fill="#d4be98" fill-opacity="0.88" text-anchor="middle">unit tests · no fabric access</text><g transform="translate(414.0,130.0)"><circle r="17" fill="#1d2021" stroke="#7daea3" stroke-width="1.4"/><g fill="none" stroke="#7daea3" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M-6,0 L-2,5 L7,-5"/></g></g><rect x="180.0" y="256.0" width="240" height="56" rx="28.0" fill="#282828"/><rect x="180.0" y="256.0" width="240" height="56" rx="28.0" fill="url(#g-yellow)"/><rect x="180.0" y="256.0" width="240" height="56" rx="28.0" fill="none" stroke="#d8a657" stroke-width="1.6" filter="url(#glow)"/><text x="300" y="289.0" font-size="15" font-weight="700" fill="#ddc7a1" text-anchor="middle">From a fork?</text><g transform="translate(394.0,262.0)"><circle r="17" fill="#1d2021" stroke="#d8a657" stroke-width="1.4"/><g fill="none" stroke="#d8a657" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M-3,-4 C-3,-8 4,-8 4,-4 C4,-1 0,-1 0,2"/><path d="M0,6 V6.1"/></g></g><rect x="490.0" y="246.0" width="220" height="76" rx="12" fill="#282828"/><rect x="490.0" y="246.0" width="220" height="76" rx="12" fill="url(#g-purple)"/><rect x="490.0" y="246.0" width="220" height="76" rx="12" fill="none" stroke="#d3869b" stroke-width="1.6" filter="url(#glow)"/><text x="600" y="278.5" font-size="14" font-weight="700" fill="#ddc7a1" text-anchor="middle">Owner releases the run</text><text x="600" y="297.5" font-size="12.5" fill="#d4be98" fill-opacity="0.88" text-anchor="middle">after reading the diff</text><g transform="translate(704.0,252.0)"><circle r="17" fill="#1d2021" stroke="#d3869b" stroke-width="1.4"/><g fill="none" stroke="#d3869b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="0" cy="-4" r="3.6"/><path d="M-7,7 C-7,1 7,1 7,7"/></g></g><rect x="180.0" y="372.0" width="240" height="84" rx="12" fill="#282828"/><rect x="180.0" y="372.0" width="240" height="84" rx="12" fill="url(#g-green)"/><rect x="180.0" y="372.0" width="240" height="84" rx="12" fill="none" stroke="#a9b665" stroke-width="1.6" filter="url(#glow)"/><text x="300" y="400.0" font-size="15" font-weight="700" fill="#ddc7a1" text-anchor="middle">Dry run</text><text x="300" y="419.0" font-size="12.5" fill="#d4be98" fill-opacity="0.88" text-anchor="middle">check mode on the live fabric</text><text x="300" y="436.0" font-size="12.5" fill="#d4be98" fill-opacity="0.88" text-anchor="middle">exactly the released commit</text><g transform="translate(414.0,378.0)"><circle r="17" fill="#1d2021" stroke="#a9b665" stroke-width="1.4"/><g fill="none" stroke="#a9b665" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M-4,-6 L6,0 L-4,6 Z"/></g></g><rect x="180.0" y="500.0" width="240" height="76" rx="12" fill="#282828"/><rect x="180.0" y="500.0" width="240" height="76" rx="12" fill="url(#g-aqua)"/><rect x="180.0" y="500.0" width="240" height="76" rx="12" fill="none" stroke="#89b482" stroke-width="1.6" filter="url(#glow)"/><text x="300" y="532.5" font-size="15" font-weight="700" fill="#ddc7a1" text-anchor="middle">Batfish</text><text x="300" y="551.5" font-size="12.5" fill="#d4be98" fill-opacity="0.88" text-anchor="middle">ten checks on the candidate</text><g transform="translate(414.0,506.0)"><circle r="17" fill="#1d2021" stroke="#89b482" stroke-width="1.4"/><g fill="none" stroke="#89b482" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="0" cy="-6" r="2.4"/><circle cx="-7" cy="6" r="2.4"/><circle cx="7" cy="6" r="2.4"/><path d="M-1.3,-3.8 L-5.8,3.8 M1.3,-3.8 L5.8,3.8 M-4.6,6 H4.6"/></g></g><rect x="180.0" y="614.0" width="240" height="84" rx="12" fill="#282828"/><rect x="180.0" y="614.0" width="240" height="84" rx="12" fill="url(#g-orange)"/><rect x="180.0" y="614.0" width="240" height="84" rx="12" fill="none" stroke="#e78a4e" stroke-width="1.6" filter="url(#glow)"/><text x="300" y="642.0" font-size="15" font-weight="700" fill="#ddc7a1" text-anchor="middle">Result</text><text x="300" y="661.0" font-size="12.5" fill="#d4be98" fill-opacity="0.88" text-anchor="middle">a table on the pull request</text><text x="300" y="678.0" font-size="12.5" fill="#d4be98" fill-opacity="0.88" text-anchor="middle">and on the change ticket</text><g transform="translate(414.0,620.0)"><circle r="17" fill="#1d2021" stroke="#e78a4e" stroke-width="1.4"/><g fill="none" stroke="#e78a4e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M-8,8 H8 M-8,8 V-8"/><path d="M-5,4 L-1,-1 L2,2 L7,-5"/></g></g>
<rect x="433.9" y="271.0" width="42.1" height="26" rx="8" fill="#1d2021" stroke="#d8a657" stroke-opacity="0.9" stroke-width="1.2"/><text x="455" y="291.0" font-size="12" fill="#d4be98" text-anchor="middle">yes</text><rect x="282.3" y="327.0" width="35.4" height="26" rx="8" fill="#1d2021" stroke="#d8a657" stroke-opacity="0.9" stroke-width="1.2"/><text x="300" y="347.0" font-size="12" fill="#d4be98" text-anchor="middle">no</text>
