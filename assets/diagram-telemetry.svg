="#d3869b" stroke-width="2" stroke-linecap="round" marker-end="url(#a-purple)"/></g>
<rect x="270.0" y="28.0" width="220" height="56" rx="12" fill="#282828"/><rect x="270.0" y="28.0" width="220" height="56" rx="12" fill="url(#g-yellow)"/><rect x="270.0" y="28.0" width="220" height="56" rx="12" fill="none" stroke="#d8a657" stroke-width="1.6" filter="url(#glow)"/><text x="380" y="61.0" font-size="15" font-weight="700" fill="#ddc7a1" text-anchor="middle">Nexus switches</text><g transform="translate(484.0,34.0)"><circle r="17" fill="#1d2021" stroke="#d8a657" stroke-width="1.4"/><g fill="none" stroke="#d8a657" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="0" cy="-6" r="2.4"/><circle cx="-7" cy="6" r="2.4"/><circle cx="7" cy="6" r="2.4"/><path d="M-1.3,-3.8 L-5.8,3.8 M1.3,-3.8 L5.8,3.8 M-4.6,6 H4.6"/></g></g><rect x="45.0" y="166.0" width="190" height="68" rx="12" fill="#282828"/><rect x="45.0" y="166.0" width="190" height="68" rx="12" fill="url(#g-blue)"/><rect x="45.0" y="166.0" width="190" height="68" rx="12" fill="none" stroke="#7daea3" stroke-width="1.6" filter="url(#glow)"/><text x="140" y="194.5" font-size="14.5" font-weight="700" fill="#ddc7a1" text-anchor="middle">Telegraf</text><text x="140" y="213.5" font-size="12.5" fill="#d4be98" fill-opacity="0.88" text-anchor="middle">gNMI, streaming</text><rect x="285.0" y="166.0" width="190" height="68" rx="12" fill="#282828"/><rect x="285.0" y="166.0" width="190" height="68" rx="12" fill="url(#g-blue)"/><rect x="285.0" y="166.0" width="190" height="68" rx="12" fill="none" stroke="#7daea3" stroke-width="1.6" filter="url(#glow)"/><text x="380" y="194.5" font-size="14.5" font-weight="700" fill="#ddc7a1" text-anchor="middle">SNMP exporter</text><text x="380" y="213.5" font-size="12.5" fill="#d4be98" fill-opacity="0.88" text-anchor="middle">SNMPv3, polling</text><rect x="525.0" y="166.0" width="190" height="68" rx="12" fill="#282828"/><rect x="525.0" y="166.0" width="190" height="68" rx="12" fill="url(#g-blue)"/><rect x="525.0" y="166.0" width="190" height="68" rx="12" fill="no