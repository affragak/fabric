.5" font-size="12.5" fill="#d4be98" fill-opacity="0.88" text-anchor="middle">dashboards</text><rect x="275.0" y="472.0" width="210" height="56" rx="12" fill="#282828"/><rect x="275.0" y="472.0" width="210" height="56" rx="12" fill="url(#g-red)"/><rect x="275.0" y="472.0" width="210" height="56" rx="12" fill="none" stroke="#ea6962" stroke-width="1.6" filter="url(#glow)"/><text x="380" y="505.0" font-size="15" font-weight="700" fill="#ddc7a1" text-anchor="middle">Alertmanager</text><g transform="translate(479.0,478.0)"><circle r="17" fill="#1d2021" stroke="#ea6962" stroke-width="1.4"/><g fill="none" stroke="#ea6962" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M-6,5 C-4,3 -5,-6 0,-6 C5,-6 4,3 6,5 Z"/><path d="M-2,8 C-1,9.4 1,9.4 2,8"/></g></g><rect x="60.0" y="612.0" width="160" height="56" rx="12" fill="#282828"/><rect x="60.0" y="612.0" width="160" height="56" rx="12" fill="url(#g-fg)"/><rect x="60.0" y="612.0" width="160" height="56" rx="12" fill="none" stroke="#ddc7a1" stroke-width="1.6" filter="url(#glow)"/><text x="140" y="645.0" font-size="15" font-weight="700" fill="#ddc7a1" text-anchor="middle">Chat</text><g transform="translate(214.0,618.0)"><circle r="17" fill="#1d2021" stroke="#ddc7a1" stroke-width="1.4"/><g fill="none" stroke="#ddc7a1" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M-8,-6 H8 V4 H-1 L-5,8 V4 H-8 Z"/></g></g><rect x="280.0" y="602.0" width="200" height="76" rx="12" fill="#282828"/><rect x="280.0" y="602.0" width="200" height="76" rx="12" fill="url(#g-purple)"/><rect x="280.0" y="602.0" width="200" height="76" rx="12" fill="none" stroke="#d3869b" stroke-width="1.6" filter="url(#glow)"/><text x="380" y="634.5" font-size="15" font-weight="700" fill="#ddc7a1" text-anchor="middle">Alarm bridge</text><text x="380" y="653.5" font-size="12.5" fill="#d4be98" fill-opacity="0.88" text-anchor="middle">opens, annotates, closes</text><rect x="525.0" y="598.0" width="190" height="84" rx="12" fill="#282828"/><rect x="525.0" y="598.0" width="190" height="84" rx="12" fill="url(#g-fg)"/><rect x="525.0" y="598.0" width="190" height="84" rx="12" fill="none" stroke="#ddc7a1" stroke-width="1.6" filter="url(#glow)"/><text x="620" y="626.0" font-size="14" font-weight="700" fill="#ddc7a1" text-anchor="middle">Dead-man's switch</text><text x="620" y="645.0" font-size="12.5" fill="#d4be98" fill-opacity="0.88" text-anchor="middle">raises its own alarm</text><text x="620" y="662.0" font-size="12.5" fill="#d4be98" fill-opacity="0.88" text-anchor="middle">when the heartbeat stops</text><g transform="translate(709.0,604.0)"><circle r="17" fill="#1d2021" stroke="#ddc7a1" stroke-width="1.4"/><g fill="none" stroke="#ddc7a1" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="0" cy="0" r="7.5"/><path d="M0,-4 V0 L3,2"/></g></g><rect x="280.0" y="740.0" width="200" height="76" rx="12" fill="#282828"/><rect x="280.0" y="740.0" width="200" height="76" rx="12" fill="url(#g-red)"/><rect x="280.0" y="740.0" width="200" height="76" rx="12" fill="none" stroke="#ea6962" stroke-width="1.6" filter="url(#glow)"/><text x="380" y="764.0" font-size="15" font-weight="700" fill="#ddc7a1" text-anchor="middle">Tickets</text><text x="380" y="783.0" font-size="12.5" fill="#d4be98" fill-opacity="0.88" text-anchor="middle">one per alarm,</text><text x="380" y="800.0" font-size="12.5" fill="#d4be98" fill-opacity="0.88" text-anchor="middle">with its runbook</text><g transform="translate(474.0,746.0)"><circle r="17" fill="#1d2021" stroke="#ea6962" stroke-width="1.4"/><g fill="none" stroke="#ea6962" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M-6,5 C-4,3 -5,-6 0,-6 C5,-6 4,3 6,5 Z"/><path d="M-2,8 C-1,9.4 1,9.4 2,8"/></g></g>
