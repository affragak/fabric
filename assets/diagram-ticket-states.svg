<rect x="230.0" y="40.0" width="200" height="60" rx="30.0" fill="#282828"/><rect x="230.0" y="40.0" width="200" height="60" rx="30.0" fill="url(#g-blue)"/><rect x="230.0" y="40.0" width="200" height="60" rx="30.0" fill="none" stroke="#7daea3" stroke-width="1.6" filter="url(#glow)"/><text x="330" y="64.5" font-size="14.5" font-weight="700" fill="#ddc7a1" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">new</text><text x="330" y="83.5" font-size="12.5" fill="#d4be98" fill-opacity="0.88" text-anchor="middle">the ticket is created</text><rect x="230.0" y="160.0" width="200" height="60" rx="30.0" fill="#282828"/><rect x="230.0" y="160.0" width="200" height="60" rx="30.0" fill="url(#g-blue)"/><rect x="230.0" y="160.0" width="200" height="60" rx="30.0" fill="none" stroke="#7daea3" stroke-width="1.6" filter="url(#glow)"/><text x="330" y="184.5" font-size="14.5" font-weight="700" fill="#ddc7a1" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">assess</text><text x="330" y="203.5" font-size="12.5" fill="#d4be98" fill-opacity="0.88" text-anchor="middle">the pull request is open</text><rect x="230.0" y="290.0" width="200" height="60" rx="30.0" fill="#282828"/><rect x="230.0" y="290.0" width="200" height="60" rx="30.0" fill="url(#g-purple)"/><rect x="230.0" y="290.0" width="200" height="60" rx="30.0" fill="none" stroke="#d3869b" stroke-width="1.6" filter="url(#glow)"/><text x="330" y="314.5" font-size="14.5" font-weight="700" fill="#ddc7a1" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">approved</text><text x="330" y="333.5" font-size="12.5" fill="#d4be98" fill-opacity="0.88" text-anchor="middle">the change may deploy</text><rect x="230.0" y="420.0" width="200" height="60" rx="30.0" fill="#282828"/><rect x="230.0" y="420.0" width="200" height="60" rx="30.0" fill="url(#g-green)"/><rect x="230.0" y="420.0" width="200" height="60" rx="30.0" fill="none" stroke="#a9b665" stroke-width="1.6" filter="url(#glow)"/><text x="330" y="444.5" font-size="14.5" font-weight="700" fill="#ddc7a1" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">implementing</text><text x="330" y="463.5" font-size="12.5" fill="#d4be98" fill-opacity="0.88" text-anchor="middle">the deploy is running</text><rect x="230.0" y="550.0" width="200" height="60" rx="30.0" fill="#282828"/><rect x="230.0" y="550.0" width="200" height="60" rx="30.0" fill="url(#g-blue)"/><rect x="230.0" y="550.0" width="200" height="60" rx="30.0" fill="none" stroke="#7daea3" stroke-width="1.6" filter="url(#glow)"/><text x="330" y="574.5" font-size="14.5" font-weight="700" fill="#ddc7a1" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">review</text><text x="330" y="593.5" font-size="12.5" fill="#d4be98" fill-opacity="0.88" text-anchor="middle">deployed and verified</text><rect x="230.0" y="680.0" width="200" height="60" rx="30.0" fill="#282828"/><rect x="230.0" y="680.0" width="200" height="60" rx="30.0" fill="url(#g-purple)"/><rect x="230.0" y="680.0" width="200" height="60" rx="30.0" fill="none" stroke="#d3869b" stroke-width="1.6" filter="url(#glow)"/><text x="330" y="704.5" font-size="14.5" font-weight="700" fill="#ddc7a1" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">closed</text><text x="330" y="723.5" font-size="12.5" fill="#d4be98" fill-opacity="0.88" text-anchor="middle">done</text><rect x="35.0" y="160.0" width="150" height="60" rx="30.0" fill="#282828"/><rect x="35.0" y="160.0" width="150" height="60" rx="30.0" fill="url(#g-purple)"/><rect x="35.0" y="160.0" width="150" height="60" rx="30.0" fill="none" stroke="#d3869b" stroke-width="1.6" filter="url(#glow)"/><text x="110" y="184.5" font-size="14.5" font-weight="700" fill="#ddc7a1" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">rejected</text><text x="110" y="203.5" font-size="12.5" fill="#d4be98" fill-opacity="0.88" text-anchor="middle">abandoned</text>
