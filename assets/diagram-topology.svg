<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 556" width="760" height="556" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Topology of the fabric</title>
<desc id="d">Two spines, each linked to three leafs and two border leafs. Leaf-101 and leaf-102 are a vPC pair with a dual-homed host. The border leafs peer with an external router by eBGP, one session per tenant.</desc>
