<line x1="300.0" y1="58" x2="300.0" y2="342" stroke="#928374" stroke-opacity="0.5" stroke-width="1"/><text x="300.0" y="48" font-size="11" fill="#928374" text-anchor="middle">0 s</text><line x1="390.0" y1="58" x2="390.0" y2="342" stroke="#928374" stroke-opacity="0.22" stroke-width="1"/><text x="390.0" y="48" font-size="11" fill="#928374" text-anchor="middle">30 s</text><line x1="480.0" y1="58" x2="480.0" y2="342" stroke="#928374" stroke-opacity="0.22" stroke-width="1"/><text x="480.0" y="48" font-size="11" fill="#928374" text-anchor="middle">60 s</text><line x1="570.0" y1="58" x2="570.0" y2="342" stroke="#928374" stroke-opacity="0.22" stroke-width="1"/><text x="570.0" y="48" font-size="11" fill="#928374" text-anchor="middle">90 s</text><line x1="660.0" y1="58" x2="660.0" y2="342" stroke="#928374" stroke-opacity="0.22" stroke-width="1"/><text x="660.0" y="48" font-size="11" fill="#928374" text-anchor="middle">120 s</text><text x="36" y="48" font-size="11" fill="#928374" letter-spacing="1.3">TRAFFIC LOST ON THE WORST FLOW</text><text x="36" y="93" font-size="13.5" font-weight="700" fill="#ddc7a1">A link shut at one end</text><text x="36" y="110" font-size="11.5" fill="#928374">the end that sees it reports it</text><text x="290" y="101" font-size="11" fill="#928374" text-anchor="end">as built</text><rect x="300" y="90.5" width="3.0" height="13" rx="3" fill="#ddc7a1" filter="url(#glow)"/><text x="312.0" y="101.5" font-size="12.5" font-weight="700" fill="#d4be98">about 1 s</text><text x="36" y="163" font-size="13.5" font-weight="700" fill="#ddc7a1">A silent link cut</text><text x="36" y="180" font-size="11.5" fill="#928374">neither end sees it</text><text x="290" y="161" font-size="11" fill="#928374" text-anchor="end">before</text><rect x="300" y="150.5" width="117.0" height="13" rx="3" fill="#e78a4e" fill-opacity="0.16" stroke="#e78a4e" stroke-width="1.5"/><text x="426.0" y="161.5" font-size="12.5" font-weight="700" fill="#d4be98">39 s</text><text x="290" y="181" font-size="11" fill="#928374" text-anchor="end">after</text><rect x="300" y="170.5" width="18.0" height="13" rx="3" fill="#7daea3" filter="url(#glow)"/><text x="327.0" y="181.5" font-size="12.5" font-weight="700" fill="#d4be98">6 s</text><text x="36" y="233" font-size="13.5" font-weight="700" fill="#ddc7a1">One spine out</text><text x="36" y="250" font-size="11.5" fill="#928374">its neighbours keep carrier</text><text x="290" y="231" font-size="11" fill="#928374" text-anchor="end">before</text><text x="308" y="231" font-size="11.5" fill="#928374" font-style="italic">not measured</text><text x="290" y="251" font-size="11" fill="#928374" text-anchor="end">after</text><rect x="300" y="240.5" width="21.0" height="13" rx="3" fill="#7daea3" filter="url(#glow)"/><text x="330.0" y="251.5" font-size="12.5" font-weight="700" fill="#d4be98">7 s</text><text x="36" y="303" font-size="13.5" font-weight="700" fill="#ddc7a1">A border leaf loses its exit</text><text x="36" y="320" font-size="11.5" fill="#928374">the outside keeps the BGP session</text><text x="290" y="301" font-size="11" fill="#928374" text-anchor="end">before</text><rect x="300" y="290.5" width="375.0" height="13" rx="3" fill="#e78a4e" fill-opacity="0.16" stroke="#e78a4e" stroke-width="1.5"/><text x="684.0" y="301.5" font-size="12.5" font-weight="700" fill="#d4be98">125 s</text><text x="290" y="321" font-size="11" fill="#928374" text-anchor="end">after</text><rect x="300" y="310.5" width="27.0" height="13" rx="3" fill="#7daea3" filter="url(#glow)"/><text x="336.0" y="321.5" font-size="12.5" font-weight="700" fill="#d4be98">9 s</text><rect x="36" y="352" width="26" height="11" rx="3" fill="#e78a4e" fill-opacity="0.16" stroke="#e78a4e" stroke-width="1.5"/><text x="70" y="362" font-size="11.5" fill="#d4be98" fill-opacity="0.9">before: default timers</text><rect x="222" y="352" width="26" height="11" rx="3" fill="#7daea3"/><text x="256" y="362" font-size="11.5" fill="#d4be98" fill-opacity="0.9">after: timers in the data model</text>
</svg>
