<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" width="760" height="560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">How work reaches the agents</title>
<desc id="d">The owner talks to the lead through a chat bridge, one thread per task, with approval buttons. The lead gives tasks to the workers and gets reports back, and reviews pull requests, which the workers open. Timers wake the workers for alarm triage, change follow-up and the daily digest.</desc>
