ed states</text><rect x="96" y="82" width="636" height="46" rx="11" fill="#282828"/><rect x="96" y="82" width="636" height="46" rx="11" fill="url(#g-blue)"/><rect x="96" y="82" width="636" height="46" rx="11" fill="none" stroke="#7daea3" stroke-width="1.5" filter="url(#glow)"/><circle cx="124" cy="105.0" r="13.5" fill="#1d2021" stroke="#7daea3" stroke-width="1.4"/><text x="124" y="109.5" font-size="12.5" font-weight="700" fill="#7daea3" text-anchor="middle">10</text><text x="152" y="110.0" font-size="14.5" font-weight="700" fill="#ddc7a1">The agents</text><text x="366" y="109.5" font-size="12.5" fill="#d4be98" fill-opacity="0.85">accounts, limits, skills, timers</text><rect x="96" y="26" width="636" height="46" rx="11" fill="#282828"/><rect x="96" y="26" width="636" height="46" rx="11" fill="url(#g-fg)"/><rect x="96" y="26" width="636" height="46" rx="11" fill="none" stroke="#ddc7a1" stroke-width="1.5" filter="url(#glow)"/><circle cx="124" cy="49.0" r="13.5" fill="#1d2021" stroke="#ddc7a1" stroke-width="1.4"/><text x="124" y="53.5" font-size="12.5" font-weight="700" fill="#ddc7a1" text-anchor="middle">11</text><text x="152" y="54.0" font-size="14.5" font-weight="700" fill="#ddc7a1">Mission Control</text><text x="366" y="53.5" font-size="12.5" fill="#d4be98" fill-opacity="0.85">reads what the layers record</text>
<text transform="translate(30,331.0) rotate(-90)" font-size="11.5" fill="#928374" text-anchor="middle" letter-spacing="1.4">BUILT IN THIS ORDER</text>
</svg>
