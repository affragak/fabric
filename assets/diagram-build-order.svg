<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 662" width="760" height="662" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">The build order</title>
<desc id="d">Eleven layers, each needing the ones below it: 1 The lab; 2 Day zero; 3 Toolchain and data model; 4 First deploy; 5 The platform; 6 The pipeline; 7 Telemetry and alarms; 8 Tickets and the record; 9 Change control; 10 The agents; 11 Mission Control.</desc>
