<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 1290" width="760" height="1290" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Architecture of the fabric project</title>
<desc id="d">The owner chats with an agent team, merges into Git and approves tickets. The agents open pull requests and have a read-only view of the fabric. Git feeds the pipeline, which deploys to the VXLAN/EVPN fabric with checkpoint, canary and rollback, merges the change's branch into NetBox, and whose gate reads the ticket. The fabric sends gNMI, SNMP and syslog to the telemetry stack, whose alarms open and close tickets. Mission Control reads telemetry, tickets and NetBox.</desc>
