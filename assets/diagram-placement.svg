<rect x="220.0" y="32.0" width="320" height="92" rx="12" fill="#282828"/><rect x="220.0" y="32.0" width="320" height="92" rx="12" fill="url(#g-blue)"/><rect x="220.0" y="32.0" width="320" height="92" rx="12" fill="none" stroke="#7daea3" stroke-width="1.6" filter="url(#glow)"/><text x="380" y="64.0" font-size="15" font-weight="700" fill="#ddc7a1" text-anchor="middle">Raspberry Pi 5</text><text x="380" y="83.0" font-size="12.5" fill="#d4be98" fill-opacity="0.88" text-anchor="middle">agents · fabric MCP server</text><text x="380" y="100.0" font-size="12.5" fill="#d4be98" fill-opacity="0.88" text-anchor="middle">identity provider · cluster management</text><g transform="translate(534.0,38.0)"><circle r="17" fill="#1d2021" stroke="#7daea3" stroke-width="1.4"/><g fill="none" stroke="#7daea3" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="-7" y="-7" width="14" height="6" rx="1.4"/><rect x="-7" y="1" width="14" height="6" rx="1.4"/><path d="M-4,-4 H-3.9 M-4,4 H-3.9"/></g></g><rect x="45.0" y="265.0" width="290" height="110" rx="12" fill="#282828"/><rect x="45.0" y="265.0" width="290" height="110" rx="12" fill="url(#g-green)"/><rect x="45.0" y="265.0" width="290" height="110" rx="12" fill="none" stroke="#a9b665" stroke-width="1.6" filter="url(#glow)"/><text x="190" y="297.5" font-size="15" font-weight="700" fill="#ddc7a1" text-anchor="middle">Kubernetes cluster</text><text x="190" y="316.5" font-size="12.5" fill="#d4be98" fill-opacity="0.88" text-anchor="middle">forge and runners · monitoring</text><text x="190" y="333.5" font-size="12.5" fill="#d4be98" fill-opacity="0.88" text-anchor="middle">logging · tickets · NetBox</text><text x="190" y="350.5" font-size="12.5" fill="#d4be98" fill-opacity="0.88" text-anchor="middle">Mission Control · docs</text><g transform="translate(329.0,271.0)"><circle r="17" fill="#1d2021" stroke="#a9b665" stroke-width="1.4"/><g fill="none" stroke="#a9b665" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round