<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 568" width="760" height="568" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Where things run</title>
<desc id="d">A Raspberry Pi 5 runs the agents, the fabric MCP server, the identity provider and the cluster's management; it sends pull requests and tickets to the Kubernetes cluster and has a read-only view of the lab. The cluster deploys to the lab from one runner and receives its telemetry, reads secrets from and writes backups to a storage server.</desc>
