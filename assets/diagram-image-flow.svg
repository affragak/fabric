ion</text><text x="220" y="743.5" font-size="12.5" fill="#d4be98" fill-opacity="0.88" text-anchor="middle">the signature is verified</text><g transform="translate(329.0,698.0)"><circle r="17" fill="#1d2021" stroke="#7daea3" stroke-width="1.4"/><g fill="none" stroke="#7daea3" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M0,-8 L7,-5 V1 C7,5 3,8 0,9 C-3,8 -7,5 -7,1 V-5 Z"/><path d="M-3,0 L-1,3 L4,-3"/></g></g><rect x="105.0" y="804.0" width="230" height="56" rx="12" fill="#282828"/><rect x="105.0" y="804.0" width="230" height="56" rx="12" fill="url(#g-green)"/><rect x="105.0" y="804.0" width="230" height="56" rx="12" fill="none" stroke="#a9b665" stroke-width="1.6" filter="url(#glow)"/><text x="220" y="837.0" font-size="15" font-weight="700" fill="#ddc7a1" text-anchor="middle">Running</text><g transform="translate(329.0,810.0)"><circle r="17" fill="#1d2021" stroke="#a9b665" stroke-width="1.4"/><g fill="none" stroke="#a9b665" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M-6,0 L-2,5 L7,-5"/></g></g>
