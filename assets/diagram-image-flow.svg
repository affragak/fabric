<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 880" width="760" height="880" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">From a merge to the cluster</title>
<desc id="d">A pull request passes its required checks and the owner merges it. Manifests are applied by Flux. A component with its own image is built, scanned and signed, its tag is moved to the signed digest, and image automation commits the new digest to main, which Flux applies. Admission verifies the signature before anything runs.</desc>
