r merges</text><g transform="translate(329.0,258.0)"><circle r="17" fill="#1d2021" stroke="#d3869b" stroke-width="1.4"/><g fill="none" stroke="#d3869b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="0" cy="-4" r="3.6"/><path d="M-7,7 C-7,1 7,1 7,7"/></g></g><rect x="445.0" y="360.0" width="230" height="76" rx="12" fill="#282828"/><rect x="445.0" y="360.0" width="230" height="76" rx="12" fill="url(#g-orange)"/><rect x="445.0" y="360.0" width="230" height="76" rx="12" fill="none" stroke="#e78a4e" stroke-width="1.6" filter="url(#glow)"/><text x="560" y="392.5" font-size="15" font-weight="700" fill="#ddc7a1" text-anchor="middle">Build</text><text x="560" y="411.5" font-size="12.5" fill="#d4be98" fill-opacity="0.88" text-anchor="middle">Trivy scan · cosign signature</text><g transform="translate(669.0,366.0)"><circle r="17" fill="#1d2021" stroke="#e78a4e" stroke-width="1.4"/><g fill="none" stroke="#e78a4e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="0" cy="0" r="4.9"/><circle cx="0" cy="0" r="1.7"/><path d="M4.53,1.88 L7.39,3.06 M1.88,4.53 L3.06,7.39 M-1.88,4.53 L-3.06,7.39 M-4.53,1.88 L-7.39,3.06 M-4.53,-1.88 L-7.39,-3.06 M-1.88,-4.53 L-3.06,-7.39 M1.88,-4.53 L3.06,-7.39 M4.53,-1.88 L7.39,-3.06" stroke-width="2.6"/></g></g><rect x="445.0" y="474.0" width="230" height="76" rx="12" fill="#282828"/><rect x="445.0" y="474.0" width="230" height="76" rx="12" fill="url(#g-yellow)"/><rect x="445.0" y="474.0" width="230" height="76" rx="12" fill="none" stroke="#d8a657" stroke-width="1.6" filter="url(#glow)"/><text x="560" y="498.0" font-size="15" font-weight="700" fill="#ddc7a1" text-anchor="middle">Promote</text><text x="560" y="517.0" font-size="12.5" fill="#d4be98" fill-opacity="0.88" text-anchor="middle">the tag moves to</text><text x="560" y="534.0" font-size="12.5" fill="#d4be98" fill-opacity="0.88" text-anchor="middle">the signed digest</text><rect x="445.0" y="588.0" width="230" height="76" rx="12" fill="#2